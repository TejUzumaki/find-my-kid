<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find My Kid</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --border: #334155; --text: #f8fafc; --muted: #94a3b8; --accent: #3b82f6; --danger: #ef4444; --success: #10b981; }
        body { font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; background: var(--bg); color: var(--text); text-align: center; padding: 20px; box-sizing: border-box; }
        .card { background: var(--card); padding: 24px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); width: 100%; max-width: 400px; margin-bottom: 16px; border: 1px solid var(--border); box-sizing: border-box; }
        #qrcode img, #qrcode canvas { border: 8px solid var(--card); border-radius: 8px; }
        h1 { font-size: 24px; margin-bottom: 8px; color: var(--text); }
        h2 { font-size: 18px; margin: 0 0 12px 0; color: var(--text); display: flex; align-items: center; justify-content: center; gap: 8px; }
        p { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
        #status { font-weight: bold; color: var(--success); display: none; align-items: center; gap: 8px; margin-top: 16px; }
        #pairing-code { font-size: 32px; font-weight: bold; letter-spacing: 4px; background: var(--bg); padding: 12px; border-radius: 8px; color: var(--accent); margin: 16px 0; border: 1px solid var(--accent); }
        .btn { border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; box-sizing: border-box; font-weight: bold; }
        .btn-danger { background: var(--danger); color: white; margin-top: 8px; }
        .btn-secondary { background: var(--border); color: var(--text); margin-top: 8px; }
        .hidden { display: none !important; }
        #map-container { height: 250px; width: 100%; border-radius: 12px; margin-bottom: 12px; z-index: 1; border: 1px solid var(--border); background: var(--bg); }
        .stats-list { text-align: left; font-size: 14px; color: var(--text); max-height: 200px; overflow-y: auto; }
        .stat-row { display: flex; align-items: center; margin-bottom: 12px; }
        .stat-name { width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; color: var(--muted); }
        .bar-bg { flex-grow: 1; height: 8px; background: var(--bg); border-radius: 4px; margin: 0 12px; overflow: hidden; }
        .bar-fill { height: 100%; background: var(--accent); border-radius: 4px; }
        .stat-val { font-size: 12px; color: var(--text); font-weight: bold; width: 40px; text-align: right; }
        #debug-panel { background: #020617; color: #10b981; font-family: monospace; font-size: 12px; padding: 12px; border-radius: 8px; text-align: left; max-height: 150px; overflow-y: auto; width: 100%; box-sizing: border-box; border: 1px solid var(--border); }
    </style>
</head>
<body>
    <!-- Pairing Screen -->
    <div id="pairing-screen" class="card">
        <h1><i class="fa-solid fa-location-crosshairs" style="color: var(--accent);"></i> Find My Kid</h1>
        <p>Link this device to your parent's dashboard.</p>
        <div id="qrcode" style="display: flex; justify-content: center;"></div>
        <div id="pairing-code">...</div>
        <p>Or enter this code manually</p>
        <div id="status"><i class="fa-solid fa-link"></i> Connected!</div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboard-screen" class="hidden" style="width: 100%; max-width: 400px;">
        <div class="card">
            <h2><i class="fa-solid fa-map-location-dot" style="color: var(--accent);"></i> Live Location</h2>
            <div id="map-container"></div>
            <div id="loc-display" style="font-size: 14px; color: var(--muted);">Tracking...</div>
        </div>
        <div class="card">
            <h2><i class="fa-solid fa-chart-line" style="color: #8b5cf6;"></i> App Usage</h2>
            <div id="usage-display" class="stats-list">Loading stats...</div>
        </div>
        <div class="card">
            <h2><i class="fa-solid fa-gear" style="color: var(--muted);"></i> Settings</h2>
            <button class="btn btn-danger" onclick="attemptStopTracking()"><i class="fa-solid fa-stop"></i> Stop Tracking</button>
            <button class="btn btn-secondary" onclick="toggleDebug()"><i class="fa-solid fa-bug"></i> Toggle Debug</button>
            <div id="debug-panel" class="hidden" style="margin-top: 12px;"></div>
        </div>
    </div>

    <script>
        let peer = null;
        let conn = null;
        let map = null;
        let marker = null;
        let savedPeerId = localStorage.getItem("fmk_child_peer_id");
        let latestData = { lat: 0, lng: 0, usage: [] };

        window.onerror = function(msg, url, line, col, error) {
            addDebugLog("JS ERROR: " + msg + " (line " + line + ")");
            return false;
        };

        function addDebugLog(msg) {
            const panel = document.getElementById("debug-panel");
            const time = new Date().toLocaleTimeString();
            panel.innerHTML += `[${time}] ${msg}<br>`;
            panel.scrollTop = panel.scrollHeight;
        }

        function initMap() {
            if (!map && document.getElementById('map-container')) {
                map = L.map('map-container').setView([0, 0], 13);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: 'Find My Kid' }).addTo(map);
            }
        }

        function renderCharts(usageData) {
            const container = document.getElementById("usage-display");
            if (!usageData || usageData.length === 0) {
                container.innerHTML = "No significant usage today.";
                return;
            }
            container.innerHTML = "";
            const maxMin = Math.max(...usageData.map(u => u.minutes), 1);
            usageData.slice(0, 5).forEach(u => {
                const row = document.createElement("div");
                row.className = "stat-row";
                const width = (u.minutes / maxMin) * 100;
                row.innerHTML = `
                    <div class="stat-name">${u.app.split('.').pop()}</div>
                    <div class="bar-bg"><div class="bar-fill" style="width: ${width}%"></div></div>
                    <div class="stat-val">${u.minutes}m</div>
                `;
                container.appendChild(row);
            });
        }

        function initPeer() {
            addDebugLog("Initializing PeerJS...");
            peer = new Peer(savedPeerId || undefined);

            peer.on('open', function(id) {
                addDebugLog("PeerJS open. ID: " + id);
                localStorage.setItem("fmk_child_peer_id", id); // Save ID
                
                if (!savedPeerId) {
                    new QRCode(document.getElementById("qrcode"), { text: id, width: 160, height: 160 });
                    const shortCode = Math.random().toString(36).substring(2, 5).toUpperCase() + "-" + Math.random().toString(36).substring(2, 5).toUpperCase();
                    document.getElementById("pairing-code").innerText = shortCode;
                    if (window.AndroidBridge) window.AndroidBridge.registerCode(shortCode, id);
                } else {
                    addDebugLog("Reusing saved Peer ID.");
                }
            });

            peer.on('connection', function(connection) {
                addDebugLog("Incoming parent connection...");
                conn = connection;
                conn.on('open', () => {
                    addDebugLog("Connection established!");
                    document.getElementById("status").style.display = "flex";
                    setTimeout(() => {
                        document.getElementById("pairing-screen").classList.add("hidden");
                        document.getElementById("dashboard-screen").classList.remove("hidden");
                        initMap();
                        setTimeout(() => map.invalidateSize(), 500);
                    }, 1500);
                });

                conn.on('data', function(msg) {
                    if (msg.type === 'sync_request') {
                        addDebugLog("Parent requested sync. Pushing data...");
                        if (window.AndroidBridge) window.AndroidBridge.getLatestData();
                    }
                });
                conn.on('error', (err) => addDebugLog("Conn Error: " + err));
                conn.on('close', () => {
                    addDebugLog("Connection closed. Returning to pairing screen.");
                    document.getElementById("dashboard-screen").classList.add("hidden");
                    document.getElementById("pairing-screen").classList.remove("hidden");
                });
            });
            peer.on('error', (err) => addDebugLog("Peer Error: " + err.type + " - " + err));
        }

        window.updateChildData = function(dataObj) {
            try {
                latestData = dataObj;
                addDebugLog("Data received from Android: " + JSON.stringify(dataObj).substring(0, 50) + "...");
                
                document.getElementById("loc-display").innerText = `Lat: ${latestData.lat.toFixed(4)}, Lng: ${latestData.lng.toFixed(4)}`;
                renderCharts(latestData.usage);
                
                if (map && latestData.lat !== 0) {
                    if (!marker) {
                        marker = L.marker([latestData.lat, latestData.lng]).addTo(map);
                    } else {
                        marker.setLatLng([latestData.lat, latestData.lng]);
                    }
                    map.setView([latestData.lat, latestData.lng], 16);
                }

                if (conn && conn.open) {
                    conn.send({ type: "sync_response", ...latestData });
                    addDebugLog("Data sent to parent.");
                }
            } catch (e) {
                addDebugLog("Parse Error in updateChildData: " + e);
            }
        };

        function attemptStopTracking() {
            let pin = prompt("Enter Parental PIN to stop tracking:");
            if (window.AndroidBridge && pin) {
                if (window.AndroidBridge.verifyPin(pin)) {
                    window.AndroidBridge.stopTracking();
                } else {
                    alert("Incorrect PIN");
                }
            }
        }

        function toggleDebug() {
            document.getElementById("debug-panel").classList.toggle("hidden");
        }

        initPeer();
    </script>
</body>
</html>
