<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find My Kid</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f8fafc; color: #1e293b; text-align: center; }
        #qrcode { margin: 20px 0; }
        #qrcode img, #qrcode canvas { border: 8px solid white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { font-size: 24px; margin-bottom: 8px; }
        p { color: #64748b; max-width: 300px; }
        #status { margin-top: 10px; font-weight: bold; color: #2563eb; }
    </style>
</head>
<body>
    <h1>Find My Kid</h1>
    <p>Scan this QR code with the Parent Dashboard to link devices.</p>
    <div id="qrcode"></div>
    <div id="status">Waiting for parent...</div>

    <script>
        const peer = new Peer();
        let conn = null;
        
        window.sendDataToParent = function(data) {
            if (conn && conn.open) {
                conn.send(data);
            }
        };

        peer.on('open', function(id) {
            // Using qrcodejs library now that DOM storage is enabled
            new QRCode(document.getElementById("qrcode"), {
                text: id,
                width: 200,
                height: 200
            });
        });

        peer.on('connection', function(connection) {
            conn = connection;
            document.getElementById("status").innerText = "Connected to Parent!";
            document.getElementById("qrcode").style.display = 'none';
        });
    </script>
</body>
</html>
